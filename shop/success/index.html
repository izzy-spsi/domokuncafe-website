<!doctype html>
<html lang="en">

<body class="shop-page" data-shop-page="success">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Domo Cafe home"><img src="/domo-cafe-logo-transparent.png" alt="Domo Cafe"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">☰</button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a class="nav-priority" href="/events/">Events</a><a href="/#menu">Menu</a><a href="/#visit">Visit</a>
      <a class="nav-shop" href="/shop/">Shop</a>
      <a class="nav-cart" href="/shop/cart/">Cart <span data-cart-count>0</span></a>
      <a class="button button--nav" href="https://www.toasttab.com/domo-cafe-8340-la-palma-avenue/" target="_blank" rel="noopener">Order Now</a>
    </nav>
  </header>
  <p class="shop-kicker">Merch shop · not food ordering</p>
  <main id="main">
    <section class="shop-wrap">
      <div class="container">
        <article class="confirm">
          <p class="eyebrow">You're all set</p>
          <h1>Thanks for taking Domo home.</h1>
          <div id="order-root"><p>Loading your order…</p></div>
          <div class="confirm-actions">
            <a class="button" href="/shop/">Back to the shop</a>
            <a class="button button--outline" href="/">Cafe home</a>
          </div>
        </article>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><div class="footer-bottom"><span>© 2026 Domo Cafe</span><span><a href="/shop/shipping/">Shipping</a> · <a href="/shop/returns/">Returns</a> · <a href="/shop/privacy/">Privacy</a></span></div></div></footer>
