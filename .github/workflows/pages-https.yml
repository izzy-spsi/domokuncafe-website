name: Configure Pages HTTPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-https.yml'
      - 'CNAME'

permissions:
  pages: write
  contents: read

jobs:
  configure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Retrigger apex custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Current Pages settings:"
          gh api "repos/${GITHUB_REPOSITORY}/pages"

          # Re-save the apex domain (equivalent to clicking Save in Pages settings).
          # This restarts Let's Encrypt provisioning when the cert is stuck in dns_changed.
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            --input - <<'EOF'
          {"cname":"domokuncafe.com"}
          EOF

          echo "Pages settings after save:"
          gh api "repos/${GITHUB_REPOSITORY}/pages"

      - name: Wait for certificate and enforce HTTPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
            state="$(printf '%s' "$payload" | jq -r '.https_certificate.state // "none"')"
            enforced="$(printf '%s' "$payload" | jq -r '.https_enforced')"
            domains="$(printf '%s' "$payload" | jq -r '.https_certificate.domains // [] | join(",")')"
            echo "attempt ${i}: state=${state} https_enforced=${enforced} domains=${domains}"

            if [ "$state" = "approved" ]; then
              if [ "$enforced" != "true" ]; then
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
                  --input - <<'EOF'
          {"cname":"domokuncafe.com","https_enforced":true}
          EOF
                echo "Enabled Enforce HTTPS"
              else
                echo "Enforce HTTPS already enabled"
              fi
              gh api "repos/${GITHUB_REPOSITORY}/pages"
              exit 0
            fi

            if [ "$state" = "errored" ] || [ "$state" = "bad_authz" ]; then
              echo "Certificate provisioning failed:"
              printf '%s\n' "$payload"
              exit 1
            fi

            sleep 20
          done

          echo "Certificate still not approved after waiting."
          gh api "repos/${GITHUB_REPOSITORY}/pages"
          exit 1
